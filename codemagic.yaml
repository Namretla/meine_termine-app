workflows:
  build-android:
    name: Build APK for Meine Termine App
    max_build_duration: 10
    environment:
      flutter: stable
      vars:
        PACKAGE_NAME: "com.example.meinetermin"
    scripts:
      - name: Install dependencies
        script: flutter pub get
      - name: Build APK
        script: flutter build apk
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
    publishing:
      email:
        recipients:
          - info@qmb-bergmann.de  # Optional: E-Mail für Benachrichtigung
